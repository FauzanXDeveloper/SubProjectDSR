<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMNIONE Calculator — System Flow</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f5f7fa;color:#0f172a;
       font:14px/1.55 "Segoe UI",Inter,system-ui,-apple-system,sans-serif}
  .bar{display:flex;align-items:center;gap:18px;padding:13px 24px;background:#fff;
       border-bottom:1px solid #e4e8ef;position:sticky;top:0;z-index:9}
  .bar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
  .bar .sub{font-size:12px;color:#64748b}
  .spacer{flex:1}
  button{font:inherit;font-size:12.5px;padding:7px 14px;border-radius:8px;
         border:1px solid #dbe1ea;background:#fff;color:#0f172a;cursor:pointer}
  button:hover{background:#f1f5f9}
  button.primary{background:#0f172a;border-color:#0f172a;color:#fff}
  button.primary:hover{background:#1e293b}
  .wrap{padding:20px 24px 60px}
  .card{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:8px;overflow:auto}
  #diagram{display:block;width:100%;height:auto;min-width:1100px}
  .steps{max-width:1180px;margin:26px auto 0}
  .steps h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;
            color:#64748b;margin:0 0 12px 2px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .step{display:flex;gap:11px;background:#fff;border:1px solid #e4e8ef;
        border-radius:11px;padding:12px 14px}
  .step .n{flex:0 0 24px;height:24px;border-radius:50%;color:#fff;font-size:12px;
           font-weight:700;display:flex;align-items:center;justify-content:center}
  .step b{display:block;font-size:12.5px;margin-bottom:2px}
  .step span{font-size:11.8px;color:#64748b;line-height:1.5}
  .foot{max-width:1180px;margin:22px auto 0;font-size:12px;color:#64748b;
        border-top:1px solid #e4e8ef;padding-top:14px}
  .ep-back{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;
           display:none;align-items:center;justify-content:center;padding:24px}
  .ep-card{background:#fff;border-radius:14px;width:min(1000px,94vw);max-height:92vh;
           display:flex;flex-direction:column;overflow:hidden;
           box-shadow:0 20px 60px rgba(15,23,42,.35)}
  .ep-head{display:flex;align-items:center;gap:12px;padding:13px 16px;
           border-bottom:1px solid #e4e8ef}
  .ep-head b{font-size:13px}
  .ep-body{padding:14px 16px;overflow:auto}
  .ep-body p{margin:0 0 10px;font-size:12.5px;color:#475569}
  .ep-body img{display:block;width:100%;height:auto;border:1px solid #e4e8ef;border-radius:8px}
  .ep-actions{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #e4e8ef;background:#f8fafc}
  .ep-actions a{font-size:12.5px;padding:7px 14px;border-radius:8px;border:1px solid #dbe1ea;
                background:#fff;color:#0f172a;text-decoration:none;cursor:pointer}
  .ep-actions a.primary{background:#0f172a;border-color:#0f172a;color:#fff}
  @media print{
    .bar,.foot{display:none}
    body{background:#fff}
    .card{border:0;padding:0}
    #diagram{min-width:0}
    .steps{page-break-before:always}
  }
  @page{size:A3 landscape;margin:10mm}
</style>
</head>

function svgEl(tag, attrs, parent) {
  var n = document.createElementNS(NS, tag);
  if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
  if (parent) parent.appendChild(n);
  return n;
}

function label(parent, x, y, text, attrs) {
  var t = svgEl("text", Object.assign({ x: x, y: y }, attrs || {}), parent);
  t.textContent = text;
  return t;
}

/* polyline with rounded corners */
function rounded(pts, r) {
  if (pts.length < 2) return "";
  var d = "M" + pts[0][0] + " " + pts[0][1];
  for (var i = 1; i < pts.length - 1; i++) {
    var p = pts[i], a = pts[i - 1], b = pts[i + 1];
    var v1x = p[0] - a[0], v1y = p[1] - a[1];
    var v2x = b[0] - p[0], v2y = b[1] - p[1];
    var l1 = Math.sqrt(v1x * v1x + v1y * v1y) || 1;
    var l2 = Math.sqrt(v2x * v2x + v2y * v2y) || 1;
    var rr = Math.min(r, l1 / 2, l2 / 2);
    var ax = p[0] - v1x / l1 * rr, ay = p[1] - v1y / l1 * rr;
    var bx = p[0] + v2x / l2 * rr, by = p[1] + v2y / l2 * rr;
    d += " L" + ax + " " + ay + " Q" + p[0] + " " + p[1] + " " + bx + " " + by;
  }
  var last = pts[pts.length - 1];
  d += " L" + last[0] + " " + last[1];
  return d;
}

function drawDefs(svg) {

      orient: "auto"
    }, defs);
    svgEl("path", { d: "M0 0 L8 4 L0 8 Z", fill: PAL[k] }, m);
  });
}

function drawNotes(svg) {

  });
}

  var size = tile * 0.56;
  var k = size / 24;
  var tf = "translate(" + (tx + (tile - size) / 2) + "," + (ty + (tile - size) / 2) + ") scale(" + k + ")";
  svgEl("path", {
    d: ICONS[n.ic], fill: solid ? "#fff" : n.c,
    "fill-rule": "evenodd", transform: tf
  }, parent);
  if (n.det && ICONS[n.det]) {
    svgEl("path", {
      d: ICONS[n.det], fill: solid ? n.c : "#fff",
      "fill-rule": "evenodd", transform: tf
    }, parent);
  }
}

function drawNodes(svg) {
  var g = svgEl("g", {}, svg);

  DG.nodes.forEach(function (n) {
    var grp = svgEl("g", {}, g);

    if (n.diamond) {
      var r = n.r || 38;
      svgEl("polygon", {
        points: [[n.cx, n.cy - r], [n.cx + r, n.cy], [n.cx, n.cy + r], [n.cx - r, n.cy]]
          .map(function (p) { return p.join(","); }).join(" "),
        fill: "#fff", stroke: n.c, "stroke-width": 1.6
      }, grp);
      label(grp, n.cx, n.cy + 4, n.t, {
        "font-size": 10, "font-weight": 700, fill: n.c, "text-anchor": "middle"
      });
      return;
    }

    var t = 46;
    var tx = n.cx - t / 2, ty = n.cy - t / 2;

    if (n.dashed) {
      svgEl("rect", {
        x: tx, y: ty, width: t, height: t, rx: 11,
        fill: "#fff", stroke: n.c, "stroke-width": 1.6, "stroke-dasharray": "5 4"
      }, grp);
    } else {
      svgEl("rect", { x: tx, y: ty, width: t, height: t, rx: 11, fill: n.c }, grp);
    }

    drawIcon(grp, n, t, tx, ty, !n.dashed);

    var lines = Array.isArray(n.t) ? n.t : [n.t];
    var ly = n.cy + 38;
    lines.forEach(function (ln, i) {
      label(grp, n.cx, ly + i * 13, ln, {
        "font-size": 11.4, "font-weight": 700, fill: "#1f2937", "text-anchor": "middle"
      });
    });
    if (n.s) {
      label(grp, n.cx, ly + (lines.length - 1) * 13 + 14, n.s, {
        "font-size": 9.4, fill: "#7b8794", "text-anchor": "middle"
      });
    }

    if (n.tag) {
      var w = 12 + n.tag.length * 5.8;
      var ty2 = n.cy - 45;
      svgEl("rect", { x: n.cx - w / 2, y: ty2, width: w, height: 16, rx: 8, fill: n.c }, grp);
      label(grp, n.cx, ty2 + 11.4, n.tag, {
        "font-size": 8.6, "font-weight": 800, fill: "#fff",
        "text-anchor": "middle", "letter-spacing": ".6"
      });
    }
  });
}

function drawLegend(svg) {
  var g = svgEl("g", {}, svg);
  var x = 40, y = 560, w = 600, h = 260;

  svgEl("rect", {
    x: x, y: y, width: w, height: h, rx: 13,
    fill: "#fff", stroke: "#e4e8ef", "stroke-width": 1
  }, g);

  label(g, x + 20, y + 27, "LEGEND", {
    "font-size": 10, "font-weight": 800, fill: "#64748b", "letter-spacing": "1.1"
  });

  var cx1 = x + 24, cx2 = x + 310;
  var r1 = y + 68, r2 = y + 124, r3 = y + 180;

  /* solid tile */
  svgEl("rect", { x: cx1, y: r1 - 15, width: 26, height: 26, rx: 7, fill: "#0f766e" }, g);
  label(g, cx1 + 38, r1 + 4, "component (live)", { "font-size": 11, fill: "#334155" });

  /* dashed tile */
  svgEl("rect", { x: cx2, y: r1 - 15, width: 26, height: 26, rx: 7,
    fill: "#fff", stroke: "#dc2626", "stroke-width": 1.5, "stroke-dasharray": "5 4" }, g);
  label(g, cx2 + 38, r1 + 4, "planned (CDE)", { "font-size": 11, fill: "#334155" });

  /* arrows */
  [["gray", "data flow"], ["orange", "CDE / decision path"]].forEach(function (r, i) {
    var yy = r2 + i * 0;
    var cxx = i === 0 ? cx1 : cx2;
    svgEl("path", { d: "M" + cxx + " " + yy + " L" + (cxx + 34) + " " + yy,
      fill: "none", stroke: PAL[r[0]], "stroke-width": 1.6,
      "marker-end": "url(#ar-" + r[0] + ")" }, g);
    label(g, cxx + 46, yy + 4, r[1], { "font-size": 11, fill: "#334155" });
  });

  /* dashed amber */
  svgEl("path", { d: "M" + cx1 + " " + r3 + " L" + (cx1 + 34) + " " + r3,
    fill: "none", stroke: PAL.amber, "stroke-width": 1.6, "stroke-dasharray": "6 5",
    "marker-end": "url(#ar-amber)" }, g);
  label(g, cx1 + 46, r3 + 4, "amount reduced (loop)", { "font-size": 11, fill: "#334155" });

  /* teal */
  svgEl("path", { d: "M" + cx2 + " " + r3 + " L" + (cx2 + 34) + " " + r3,
    fill: "none", stroke: PAL.teal, "stroke-width": 1.6,
    "marker-end": "url(#ar-teal)" }, g);
  label(g, cx2 + 46, r3 + 4, "analytics feed", { "font-size": 11, fill: "#334155" });

  /* zone boundary */
  svgEl("rect", { x: cx1, y: r3 + 30, width: 38, height: 22, rx: 6,
    fill: "#f8fafc", stroke: "#94a3b8", "stroke-width": 1.2, "stroke-dasharray": "5 4" }, g);
  label(g, cx1 + 50, r3 + 46, "system boundary", { "font-size": 11, fill: "#334155" });
}

function drawDiagram() {
  var svg = document.getElementById("diagram");
  svg.setAttribute("viewBox", "0 0 " + DG.w + " " + DG.h);
  svg.setAttribute("width", DG.w);
  svg.setAttribute("height", DG.h);
  svg.setAttribute("role", "img");
  svg.innerHTML = "";

  svgEl("rect", { x: 0, y: 0, width: DG.w, height: DG.h, fill: "#ffffff" }, svg);

  var title = svgEl("title", {}, svg);
  title.textContent = "OMNIONE Calculator system flow";

  drawDefs(svg);
  drawHeader(svg);
  drawZones(svg);
  drawLinks(svg);
  drawNodes(svg);
  drawNotes(svg);
  drawLegend(svg);
}

/* =====================================================================
   page wiring
   ===================================================================== */

function renderStepList() {
  var grid = document.getElementById("steps");
  grid.innerHTML = "";
  DG.steps.forEach(function (s) {
    var card = document.createElement("div");
    card.className = "step";

    var num = document.createElement("div");
    num.className = "n";
    num.style.background = s.c;
    num.textContent = s.n;

    var body = document.createElement("div");
    var head = document.createElement("b");
    head.textContent = s.t;
    var text = document.createElement("span");
    text.textContent = s.d;
    body.appendChild(head);
    body.appendChild(text);

    card.appendChild(num);
    card.appendChild(body);
    grid.appendChild(card);
  });

  document.getElementById("foot").textContent = DG.foot;
}

function exportPanel() {
  if (exportPanel.node) return exportPanel.node;

  var back = document.createElement("div");
  back.className = "ep-back";
  back.innerHTML =
    '<div class="ep-card">' +
      '<div class="ep-head"><b id="ep-title">PNG ready</b>' +
        '<span style="flex:1"></span>' +
        '<button id="ep-close">Close</button></div>' +
      '<div class="ep-body"><p id="ep-hint"></p><div id="ep-img"></div></div>' +
      '<div class="ep-actions">' +
        '<a id="ep-png" class="primary" download="omnione-system-flow.png">Save PNG</a>' +
        '<a id="ep-svg" download="omnione-system-flow.svg">Save SVG (vector)</a>' +
      '</div>' +
    '</div>';

  document.body.appendChild(back);
  exportPanel.node = back;

  document.getElementById("ep-close").addEventListener("click", function () {
    back.style.display = "none";
  });
  back.addEventListener("click", function (e) {
    if (e.target === back) back.style.display = "none";
  });

  return back;
}

function showExportPanel(pngUrl, svgUrl) {
  var back = exportPanel();
  var holder = document.getElementById("ep-img");
  holder.innerHTML = "";
  var img = document.createElement("img");
  img.alt = "OMNIONE Calculator system flow";
  img.src = pngUrl;
  holder.appendChild(img);

  document.getElementById("ep-png").href = pngUrl;
  document.getElementById("ep-svg").href = svgUrl;
  document.getElementById("ep-title").textContent = "PNG ready — " + (DG.w * 2) + " × " + (DG.h * 2);
  document.getElementById("ep-hint").innerHTML =
    "If the download did not start automatically, click <b>Save PNG</b> — " +
    "or right-click the image and choose <b>Save image as…</b>.";

  back.style.display = "flex";
}

function downloadPng() {
  var svg = document.getElementById("diagram");
  var clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", NS);

  var markup = new XMLSerializer().serializeToString(clone);
  var svgUrl = URL.createObjectURL(new Blob([markup], { type: "image/svg+xml;charset=utf-8" }));
  var img = new Image();

  img.onload = function () {
    var k = 2;
    var canvas = document.createElement("canvas");
    canvas.width = DG.w * k;
    canvas.height = DG.h * k;

    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    var pngUrl;
    try {
      pngUrl = canvas.toDataURL("image/png");
    } catch (e) {
      alert("This browser blocked the image export (" + e.name + "). Use Print / PDF instead.");
      return;
    }

    try {
      var a = document.createElement("a");
      a.href = pngUrl;
      a.download = "omnione-system-flow.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } catch (e) { /* ignored — the panel covers it */ }

    showExportPanel(pngUrl, svgUrl);
  };

  img.onerror = function () {
    alert("Could not rasterise the diagram in this browser — use Print / PDF instead.");
  };

  img.src = svgUrl;
}

function init() {
  drawDiagram();
  renderStepList();
  document.getElementById("btn-png").addEventListener("click", downloadPng);
  document.getElementById("btn-print").addEventListener("click", function () { window.print(); });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
