<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Chat App - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-card h1 {
      color: #1a1a2e;
      margin-bottom: 8px;
      font-size: 24px;
    }

    .login-card p {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-size: 14px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.3s;
    }

    .form-group input:focus {
      border-color: #4361ee;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #4361ee;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #3451d1;
    }

    .btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .error-msg {
      background: #ffe0e0;
      color: #c0392b;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
    }

    .success-msg {
      background: #e0ffe0;
      color: #27ae60;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
    }

    .divider {
      text-align: center;
      margin: 20px 0;
      color: #999;
      font-size: 13px;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: #ddd;
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .google-btn {
      width: 100%;
      padding: 12px;
      background: white;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.3s;
    }

    .google-btn:hover {
      background: #f5f5f5;
    }

    .toggle-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }

    .toggle-link span {
      color: #4361ee;
      cursor: pointer;
      font-weight: bold;
    }

    .toggle-link span:hover {
      text-decoration: underline;
    }

    .loading {
      display: none;
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h1>Welcome Back 👋</h1>
    <p>Login to access your AI Chat</p>

    <!-- Error & Success Messages -->
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input 
          type="email" 
          id="email" 
          placeholder="you@example.com" 
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Enter your password" 
          required
        />
      </div>

      <button type="submit" class="btn" id="loginBtn">
        Login
      </button>
    </form>

    <div class="divider">or</div>

    <!-- Google Login -->
    <button class="google-btn" onclick="loginWithGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" 
           width="20" alt="Google">
      Continue with Google
    </button>

    <div class="loading" id="loading">⏳ Please wait...</div>

    <div class="toggle-link">
      Don't have an account? 
      <span onclick="window.location.href='register.html'">Sign Up</span>
    </div>

  </div>

  <!-- Firebase SDK -->
  <script type="module">
    // ── Import Firebase ──────────────────────────────────────
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    // ── Your Firebase Config ─────────────────────────────────
    // Get this from Firebase Console → Project Settings
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // ── Initialize Firebase ──────────────────────────────────
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // ── Helper Functions ─────────────────────────────────────
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('errorMsg').style.display = 'none';
    }

    function setLoading(state) {
      document.getElementById('loginBtn').disabled = state;
      document.getElementById('loading').style.display = state ? 'block' : 'none';
    }

    // ── Check if Already Logged In ───────────────────────────
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // User already logged in → redirect to chat page
        window.location.href = 'chat.html';
      }
    });

    // ── Email & Password Login ───────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email    = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      setLoading(true);

      try {
        // Call Firebase Auth API
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        showSuccess(`Welcome back, ${user.email}!`);

        // Wait 1 second then redirect to chat
        setTimeout(() => {
          window.location.href = 'chat.html';
        }, 1000);

      } catch (error) {
        // Handle errors
        switch (error.code) {
          case 'auth/user-not-found':
            showError('No account found with this email.');
            break;
          case 'auth/wrong-password':
            showError('Incorrect password. Please try again.');
            break;
          case 'auth/invalid-email':
            showError('Invalid email address format.');
            break;
          case 'auth/too-many-requests':
            showError('Too many failed attempts. Please try again later.');
            break;
          default:
            showError('Login failed. Please try again.');
        }
      } finally {
        setLoading(false);
      }
    });

    // ── Google Login ─────────────────────────────────────────
    window.loginWithGoogle = async () => {
      setLoading(true);
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        showSuccess(`Welcome, ${user.displayName}!`);

        setTimeout(() => {
          window.location.href = 'chat.html';
        }, 1000);

      } catch (error) {
        showError('Google login failed. Please try again.');
      } finally {
        setLoading(false);
      }
    };

  </script>

</body>
</html>
