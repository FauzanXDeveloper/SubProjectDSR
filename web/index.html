<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARBM Financing &amp; DSR Calculator</title>
<link rel="icon" type="image/png" href="public/favicon.png">
<link rel="stylesheet" href="css/styles.css?v=20260828a">
<link rel="stylesheet" href="css/app.css?v=20260828a">
<link rel="stylesheet" href="css/theme-dark.css?v=20260828a">
<script src="js/theme.js?v=20260828a"></script>
</head>
<body>
<div class="layout">

  <!-- ================= SIDEBAR ================= -->
  <nav class="sidebar no-print" id="sidebar">
    <div class="brand" style="flex-direction:column;align-items:flex-start;gap:8px;">
      <span class="brand-logo">
        <img class="logo-full" src="public/white_logo_alrajhi.png" alt="Al Rajhi Bank">
        <img class="logo-mark" src="public/favicon.png" alt="Al Rajhi Bank">
      </span>
      <div class="t2">Financing &amp; DSR Calculator</div>
    </div>

    <div class="sidebar-scroll">
    <div class="group-label">Menu</div>
    <a class="nav-item" href="/dashboard.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      <span class="nav-txt">Dashboard</span>
    </a>

    <div id="sidebar-nav-section"><!-- filled by js/pages/calculator.js: mode buttons (new case) or the "Reviewing" chip (existing case) --></div>
    </div>

    <div class="foot">
      <button id="btn-collapse" type="button" title="Collapse sidebar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        <span class="nav-txt">Collapse sidebar</span>
      </button>
      <a href="#" id="calc-logout" title="Logout">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span class="nav-txt">Logout</span>
      </a>
      <button id="btn-theme" type="button" title="Switch theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <span class="nav-txt">Theme</span>
      </button>
      <button id="btn-print" type="button" title="Print / Export PDF">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="1.5"/><rect x="6" y="15" width="12" height="6"/></svg>
        <span class="nav-txt">Print / Export PDF</span>
      </button>
      <div id="sidebar-reset-section"><!-- filled by js/pages/calculator.js: "Reset all inputs" (new case only) --></div>
    </div>
  </nav>

  <!-- ================= MAIN ================= -->
  <main class="main">
    <!-- shown only on Print / Export PDF -->
    <div class="print-header">
      <img src="public/alrajhi_logo.png" alt="Al Rajhi Bank Malaysia">
      <div>
        <div class="ph-title">Financing &amp; DSR Evaluation Report</div>
        <div class="ph-sub" id="print-meta"></div>
      </div>
    </div>

    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="hamburger no-print" id="btn-menu" type="button" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <h1 id="page-title">Personal Financing (PF)</h1>
      </div>
      <div class="date" id="today-date"></div>
    </div>

    <div id="notice-banner"></div>

    <!-- Shared intake: required first for every mode -->
    <div id="intake-customer"></div>
    <div id="intake-ccris"></div>
    <div id="intake-income"></div>

    <!-- Gate message shown until minimum intake is complete -->
    <div id="intake-gate"></div>

    <!-- Product panels (visibility controlled by routing) -->
    <div id="panel-pf"></div>
    <div id="panel-hf"></div>
    <div id="panel-cc"></div>

    <!-- Combined application summary (combo modes): directly above sign-off -->
    <div id="combined-panel"></div>

    <!-- Maker / Checker sign-off -->
    <div id="signoff-panel"></div>

    <!-- Persistent app footer (shown on every product / combo view) -->
    <footer class="app-foot no-print">
      Copyright &copy; 2026 Al Rajhi Banking &amp; Investment Corporation (Malaysia) Bhd<br>
      Built by Retail Credit Risk (RCR) since July 2026<br>
      For internal credit evaluation use only.
    </footer>
  </main>
</div>

<!-- Curated evaluation report - hidden on screen, shown only when printing.
     Built fresh on each print by js/report.js (App.buildPrintReport). -->
<div id="print-report" aria-hidden="true"></div>

<!-- vendored pdf.js (client-side PDF parsing; no CDN dependency) -->
<script src="vendor/pdf.min.js?v=20260828a"></script>

<!-- local JSON "database" (localStorage-backed) - no server, see README
     Security note. js/pages/calculator.js (a plain blocking <script>,
     same as every tag below) checks access, sets the same
     window.__DSR_* globals the old PHP page used to inject, and fills
     the placeholders above - all BEFORE the engine/app scripts below
     it run. This must stay a static tag sequence (not dynamically
     injected): app.js and caseSync.js each register their own
     'DOMContentLoaded' listener, which only ever fires once, after
     every synchronous <script> tag below has finished executing. -->
<script src="js/store/db.js?v=20260828a"></script>
<script src="js/store/audit.js?v=20260828a"></script>
<script src="js/store/auth.js?v=20260828a"></script>
<script src="js/store/rbac.js?v=20260828a"></script>
<script src="js/store/cases.js?v=20260828a"></script>
<script src="js/store/policyConfig.js?v=20260828a"></script>
<script src="js/pages/calculator.js?v=20260828a"></script>

<!-- shared engine (pure functions, no I/O). config.js MUST load first:
     it holds every policy constant + the local database's admin overrides -->
<script src="js/engine/config.js?v=20260828a"></script>
<script src="js/engine/pmt.js?v=20260828a"></script>
<script src="js/engine/age.js?v=20260828a"></script>
<script src="js/engine/facilityRates.js?v=20260828a"></script>
<script src="js/engine/ccrisLine.js?v=20260828a"></script>
<script src="js/engine/income.js?v=20260828a"></script>
<script src="js/engine/creditLimit.js?v=20260828a"></script>
<script src="js/engine/dsrThresholds.js?v=20260828a"></script>
<script src="js/engine/hfPricing.js?v=20260828a"></script>
<script src="js/engine/hfSummary.js?v=20260828a"></script>
<script src="js/engine/pdfExtractor.js?v=20260828a"></script>
<script src="data/ndiPricing.js?v=20260828a"></script>

<!-- app -->
<script src="js/state.js?v=20260828a"></script>
<script src="js/modal.js?v=20260828a"></script>
<script src="js/format.js?v=20260828a"></script>
<script src="js/intake.js?v=20260828a"></script>
<script src="js/panels.js?v=20260828a"></script>
<script src="js/report.js?v=20260828a"></script>
<script src="js/app.js?v=20260828a"></script>
<!-- caseSync.js: after app.js on purpose - see its header comment -->
<script src="js/caseSync.js?v=20260828a"></script>
</body>
</html>
