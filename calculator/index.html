<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARBM Financing &amp; DSR Calculator</title>
<link rel="icon" type="image/png" href="public/favicon.png">
<link rel="stylesheet" href="css/styles.css?v=20261127a">
<link rel="stylesheet" href="css/theme-dark.css?v=20261127a">
<link rel="stylesheet" href="css/login.css?v=20261127a">
<script src="js/core/theme.js?v=20261127a"></script>
</head>
<body class="auth-locked">

<!-- ---------------- login ---------------- -->
<div id="login-gate" class="login-gate">
  <form id="login-form" class="login-card" autocomplete="off">
    <img class="login-logo" src="public/alrajhi_logo.png" alt="Al Rajhi Bank Malaysia">
    <h2>Financing &amp; DSR Calculator</h2>
    <label>Username
      <input id="login-user" type="text" autocomplete="username" required>
    </label>
    <label>Password
      <input id="login-pass" type="password" autocomplete="current-password" required>
    </label>
    <div id="login-msg" class="login-msg" role="alert"></div>
    <button type="submit" class="login-btn">Sign in</button>
  </form>
</div>

<!-- ---------------- app shell ---------------- -->
<div class="layout">

  <!-- ---------------- sidebar ---------------- -->
  <nav class="sidebar no-print" id="sidebar">
    <div class="brand">
      <span class="brand-logo">
        <img class="logo-full" src="public/white_logo_alrajhi.png" alt="Al Rajhi Bank">
        <img class="logo-mark" src="public/favicon.png" alt="Al Rajhi Bank">
      </span>
      <div class="brand-text">
        <div class="t2">Financing &amp; DSR Calculator</div>
      </div>
    </div>

    <div class="sidebar-scroll">

      <div id="sidebar-nav-section"></div>
    </div>

    <div class="foot">
      <div class="foot-group">
        <button id="btn-export" class="foot-row" type="button" title="Save this case to a JSON file">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>
          <span class="nav-txt">Export case</span>
        </button>
        <button id="btn-import" class="foot-row" type="button" title="Open a case from a JSON file">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 17v3h16v-3"/></svg>
          <span class="nav-txt">Import case</span>
        </button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
        <button id="btn-print" class="foot-row" type="button" title="Print / Export PDF">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="1.5"/><rect x="6" y="15" width="12" height="6"/></svg>
          <span class="nav-txt">Print / PDF</span>
        </button>
        <button id="btn-reset" class="foot-row" type="button" title="Reset all inputs">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
          <span class="nav-txt">Reset inputs</span>
        </button>
      </div>

      <div class="foot-group foot-group-end">
        <button id="btn-theme" class="foot-row" type="button"></button>
        <button id="btn-collapse" class="foot-row" type="button" title="Collapse sidebar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
          <span class="nav-txt">Collapse</span>
        </button>
        <a href="#" id="calc-logout" class="foot-row" title="Logout">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          <span class="nav-txt">Logout</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- ---------------- main ---------------- -->
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="hamburger no-print" id="btn-menu" type="button" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <h1 id="page-title">Personal Financing (PF)</h1>
      </div>
      <div class="date" id="today-date"></div>
    </div>

    <div id="intake-customer"></div>
    <div id="intake-ccris"></div>
    <div id="intake-income"></div>

    <div id="intake-gate"></div>

    <div id="product-panels"></div>

    <div id="combined-panel"></div>

    <footer class="app-foot no-print">
      Copyright &copy; 2026 Al Rajhi Banking &amp; Investment Corporation (Malaysia) Bhd<br>
      Built by Retail Credit Risk (RCR) since July 2026<br>
      For internal credit evaluation use only.
    </footer>
  </main>
</div>

<!-- ---------------- printed report ---------------- -->
<div id="print-report" aria-hidden="true"></div>

<!-- ---------------- scripts ---------------- -->
<script src="vendor/pdf.min.js?v=20261127a"></script>

<script src="js/engine/config.js?v=20261127a"></script>

<script src="js/engine/income.js?v=20261127a"></script>
<script src="js/engine/ndiV2.js?v=20261127a"></script>
<script src="js/engine/creditLimit.js?v=20261127a"></script>
<script src="js/engine/dsrThresholds.js?v=20261127a"></script>
<script src="js/engine/pfAggregate.js?v=20261127a"></script>
<script src="js/engine/hfPricing.js?v=20261127a"></script>
<script src="js/engine/hfSummary.js?v=20261127a"></script>
<script src="js/engine/pdfExtractor.js?v=20261127a"></script>
<script src="js/engine/appFormExtractor.js?v=20261127a"></script>
<script src="data/ndiPricing.js?v=20261127a"></script>
<script src="data/users.js?v=20261127a"></script>

<script src="js/core/ui.js?v=20261127a"></script>
<script src="js/core/state.js?v=20261127a"></script>
<script src="js/core/modal.js?v=20261127a"></script>
<script src="js/core/format.js?v=20261127a"></script>
<script src="js/core/applicants.js?v=20261127a"></script>
<script src="js/core/intake.js?v=20261127a"></script>
<script src="js/core/customerDetailsV2.js?v=20261127a"></script>

<script src="js/products.js?v=20261127a"></script>
<script>  DSR_PRODUCT_FILES.forEach(function (f) {
    document.write('<script src="' + f + '?v=20261127a"><\/script>');
  });
</script>

<script src="js/core/decision.js?v=20261127a"></script>
<script src="js/core/report.js?v=20261127a"></script>
<script src="js/core/passwordHash.js?v=20261102a"></script>
<script src="js/core/auth.js?v=20261102a"></script>
<script src="js/core/app.js?v=20261127a"></script>
</body>
</html>
