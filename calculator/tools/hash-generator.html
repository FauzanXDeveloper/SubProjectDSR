<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Registration</title>
<style>
  :root {
    --bg-1: #eef3f1;
    --bg-2: #e3eae8;
    --card: #ffffff;
    --ink: #1a2b27;
    --muted: #6b7a76;
    --line: #dbe4e1;
    --brand: #2219fe;
    --brand-2: #2219fe;
    --brand-ink: #ffffff;
    --danger: #c0392b;
    --code-bg: #0e1726;
    --code-ink: #dbe7f3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #ffffff 0%, transparent 60%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .card {
    width: 100%;
    max-width: 680px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow:
      0 1px 2px rgba(16, 40, 34, 0.04),
      0 18px 40px -18px rgba(16, 40, 34, 0.28);
    overflow: hidden;
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 22px 26px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #ffffff, #fafcfb);
  }
  .badge {
    height: 40px;
    padding: 0 13px;
    border-radius: 11px;
    background: linear-gradient(160deg, var(--brand-2), var(--brand));
    display: grid;
    place-items: center;
    box-shadow: 0 6px 14px -6px rgba(34, 25, 254, 0.55);
    flex: none;
  }
  .badge img {
    display: block;
    height: 22px;
    width: auto;
  }
  .card-head h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }

  form { padding: 24px 26px 26px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .col-span-2 { grid-column: span 2; }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .col-span-2 { grid-column: span 1; }
    form { padding: 20px; }
    .card-head { padding: 18px 20px; }
  }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 6px 2px;
    letter-spacing: 0.01em;
  }

  .field { position: relative; }
  input {
    width: 100%;
    height: 44px;
    padding: 0 13px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fbfdfc;
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  input::placeholder { color: #a7b4b0; }
  input:hover { border-color: #c9d5d1; }
  input:focus {
    outline: none;
    background: #ffffff;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(34, 25, 254, 0.16);
  }
  input.invalid {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.12);
  }
  input.has-eye { padding-right: 44px; }

  .eye {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    border: none;
    background: transparent;
    color: #8a9995;
    border-radius: 8px;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .eye:hover { background: #eef0ff; color: var(--brand); }

  .actions { margin-top: 22px; }
  button.primary {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(180deg, var(--brand-2), var(--brand));
    color: var(--brand-ink);
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform 0.06s, box-shadow 0.15s, filter 0.15s;
    box-shadow: 0 10px 20px -12px rgba(34, 25, 254, 0.9);
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.04); }
  button.primary:active:not(:disabled) { transform: translateY(1px); }
  button.primary:disabled {
    background: #cfdad6;
    color: #8b9a95;
    box-shadow: none;
    cursor: not-allowed;
  }

  .output {
    margin-top: 22px;
    position: relative;
  }
  .output[hidden] { display: none; }
  .output pre {
    margin: 0;
    padding: 16px 54px 16px 16px;
    background: var(--code-bg);
    color: var(--code-ink);
    border-radius: 12px;
    font-size: 12.5px;
    line-height: 1.6;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
  }
  .copy {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.08);
    color: #cfe0ee;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .copy:hover { background: rgba(255, 255, 255, 0.16); }
  .copy .icon-check { display: none; color: #6ee7b7; }
  .copy.copied { background: rgba(110, 231, 183, 0.14); }
  .copy.copied .icon-copy { display: none; }
  .copy.copied .icon-check { display: block; }
</style>
</head>
<body>
  <main class="card">
    <div class="card-head">
      <span class="badge" aria-hidden="true">
        <img src="../public/white_logo_alrajhi.png" alt="">
      </span>
      <h1>User Registration</h1>
    </div>

    <form id="register-form" autocomplete="off">
      <div class="grid">
        <div>
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="off" spellcheck="false">
        </div>
        <div>
          <label for="staffId">Staff ID</label>
          <input id="staffId" type="text" autocomplete="off" spellcheck="false">
        </div>

        <div class="col-span-2">
          <label for="name">Display name</label>
          <input id="name" type="text" autocomplete="off">
        </div>

        <div>
          <label for="password">Password</label>
          <div class="field">
            <input id="password" type="password" class="has-eye" autocomplete="new-password">
            <button class="eye" type="button" data-target="password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="2.6"/>
              </svg>
            </button>
          </div>
        </div>
        <div>
          <label for="confirm">Confirm password</label>
          <input id="confirm" type="password" autocomplete="new-password">
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="generate" type="submit" disabled>Generate</button>
      </div>

      <div class="output" id="output" hidden>
        <pre id="output-text"></pre>
        <button class="copy" id="copy" type="button" aria-label="Copy">
          <svg class="icon-copy" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2"/>
            <path d="M5 15V6a2 2 0 0 1 2-2h9"/>
          </svg>
          <svg class="icon-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        </button>
      </div>
    </form>
  </main>

<script src="../js/core/passwordHash.js"></script>
<script>
(function () {
  'use strict';

  var hasher = window.DSRPasswordHash;
  var form = document.getElementById('register-form');
  var username = document.getElementById('username');
  var staffId = document.getElementById('staffId');
  var name = document.getElementById('name');
  var password = document.getElementById('password');
  var confirm = document.getElementById('confirm');
  var generate = document.getElementById('generate');
  var output = document.getElementById('output');
  var outputText = document.getElementById('output-text');
  var copy = document.getElementById('copy');

  function isValid() {
    return username.value.trim() !== '' &&
      password.value !== '' &&
      password.value === confirm.value;
  }

  function refresh() {
    generate.disabled = !isValid();
    confirm.classList.toggle('invalid', confirm.value !== '' && password.value !== confirm.value);
  }

  [username, password, confirm].forEach(function (el) {
    el.addEventListener('input', refresh);
  });

  /* password visibility toggle */
  var eyes = document.querySelectorAll('.eye');
  for (var i = 0; i < eyes.length; i++) {
    eyes[i].addEventListener('click', function () {
      var target = document.getElementById(this.getAttribute('data-target'));
      var show = target.type === 'password';
      target.type = show ? 'text' : 'password';
    });
  }

  function escapeSingle(value) {
    return String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (!isValid()) {
      return;
    }

    var salt = hasher.randomSalt(16);
    var hash = hasher.hash(password.value, salt, hasher.DEFAULT_ITERATIONS);

    outputText.textContent =
      '  {\n' +
      "    username: '" + escapeSingle(username.value.trim()) + "',\n" +
      "    salt: '" + salt + "',\n" +
      '    iterations: ' + hasher.DEFAULT_ITERATIONS + ',\n' +
      "    hash: '" + hash + "',\n" +
      "    name: '" + escapeSingle(name.value.trim()) + "',\n" +
      "    staffId: '" + escapeSingle(staffId.value.trim()) + "'\n" +
      '  },';

    output.hidden = false;
    copy.classList.remove('copied');
  });

  copy.addEventListener('click', function () {
    var text = outputText.textContent;
    if (!text) {
      return;
    }
    function mark() {
      copy.classList.add('copied');
      setTimeout(function () { copy.classList.remove('copied'); }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(mark, function () {});
    } else {
      var range = document.createRange();
      range.selectNodeContents(outputText);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      mark();
    }
  });

  refresh();
})();
</script>
</body>
</html>
